<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold-glow: #FFA500;
    --silver: #C0C0C0;
    --bronze: #CD7F32;
    --bg-deep: #0a0618;
    --bg-mid: #120d2a;
    --bg-card: #1a1040;
    --accent-blue: #4f8ef7;
    --accent-purple: #7c3aed;
    --accent-cyan: #00d4ff;
    --accent-pink: #ff4da6;
    --positive: #00e676;
    --negative: #ff1744;
    --text-primary: #e8e0ff;
    --text-muted: #8b7ec8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-deep);
    font-family: 'Exo 2', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0,212,255,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(79,142,247,0.05) 0%, transparent 70%);
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,142,247,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Background canvas for floating stars */
  #bgCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
  .header { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 40px; animation: fadeDown 0.6s ease; }
  .trophy-icon { font-size: 2.5rem; filter: drop-shadow(0 0 12px var(--gold)); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 12px var(--gold)); } 50% { filter: drop-shadow(0 0 24px var(--gold-glow)); } }
  .header h1 { font-family: 'Orbitron', monospace; font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; text-transform: uppercase; }
  .podium-section { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-bottom: 50px; padding: 0 20px; }
  .podium-item { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: riseUp 0.8s ease both; }
  .podium-item:nth-child(1) { animation-delay: 0.3s; }
  .podium-item:nth-child(2) { animation-delay: 0.1s; }
  .podium-item:nth-child(3) { animation-delay: 0.5s; }
  @keyframes riseUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .podium-avatar-wrap { position: relative; width: 90px; height: 90px; }
  .podium-item.rank-1 .podium-avatar-wrap { width: 110px; height: 110px; }
  .podium-avatar { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.8rem; color: #fff; position: relative; overflow: hidden; }
  .rank-1 .podium-avatar { background: linear-gradient(135deg, #1a0a00, #3d1a00); border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,165,0,0.3), inset 0 0 20px rgba(255,215,0,0.1); font-size: 2rem; }
  .rank-2 .podium-avatar { background: linear-gradient(135deg, #0a0a15, #1a1a30); border: 3px solid var(--silver); box-shadow: 0 0 20px rgba(192,192,192,0.5), inset 0 0 15px rgba(192,192,192,0.1); }
  .rank-3 .podium-avatar { background: linear-gradient(135deg, #150500, #2a0f00); border: 3px solid var(--bronze); box-shadow: 0 0 20px rgba(205,127,50,0.5), inset 0 0 15px rgba(205,127,50,0.1); }
  .rank-badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 1.3rem; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
  .podium-block { width: 140px; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 14px 10px; position: relative; overflow: hidden; }
  .rank-1 .podium-block { height: 130px; background: linear-gradient(180deg, rgba(255,215,0,0.25) 0%, rgba(255,165,0,0.1) 100%); border: 1px solid rgba(255,215,0,0.4); box-shadow: 0 0 20px rgba(255,215,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1); }
  .rank-2 .podium-block { height: 95px; background: linear-gradient(180deg, rgba(192,192,192,0.2) 0%, rgba(192,192,192,0.05) 100%); border: 1px solid rgba(192,192,192,0.3); box-shadow: 0 0 15px rgba(192,192,192,0.15); }
  .rank-3 .podium-block { height: 75px; background: linear-gradient(180deg, rgba(205,127,50,0.2) 0%, rgba(205,127,50,0.05) 100%); border: 1px solid rgba(205,127,50,0.3); box-shadow: 0 0 15px rgba(205,127,50,0.15); }
  .podium-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .rank-1 .podium-block::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .rank-2 .podium-block::before { background: var(--silver); }
  .rank-3 .podium-block::before { background: var(--bronze); }
  .podium-name { font-family: 'Orbitron', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-align: center; text-transform: uppercase; margin-bottom: 4px; }
  .rank-1 .podium-name { color: var(--gold); font-size: 0.7rem; }
  .rank-2 .podium-name { color: var(--silver); }
  .rank-3 .podium-name { color: var(--bronze); }
  .podium-value { font-size: 0.75rem; font-weight: 600; color: var(--text-primary); opacity: 0.9; }
  .stats-bar { display: flex; gap: 12px; margin-bottom: 20px; animation: fadeDown 0.6s ease 0.2s both; }
  .stat-pill { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 6px 16px; font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .stat-pill span { color: var(--text-primary); font-weight: 600; }
  .ranking-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 14px; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; animation: slideIn 0.4s ease both; }
  .rank-card:nth-child(1) { animation-delay: 0.05s; }
  .rank-card:nth-child(2) { animation-delay: 0.10s; }
  .rank-card:nth-child(3) { animation-delay: 0.15s; }
  .rank-card:nth-child(4) { animation-delay: 0.20s; }
  .rank-card:nth-child(5) { animation-delay: 0.25s; }
  .rank-card:nth-child(6) { animation-delay: 0.30s; }
  .rank-card:nth-child(7) { animation-delay: 0.35s; }
  .rank-card:nth-child(8) { animation-delay: 0.40s; }
  .rank-card:nth-child(9) { animation-delay: 0.45s; }
  .rank-card:nth-child(10) { animation-delay: 0.50s; }
  .rank-card:nth-child(11) { animation-delay: 0.55s; }
  .rank-card:nth-child(12) { animation-delay: 0.60s; }
  @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .rank-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: all 0.3s ease; }
  .rank-card:hover { background: rgba(79,142,247,0.08); border-color: rgba(79,142,247,0.3); transform: translateX(4px); box-shadow: 0 4px 20px rgba(79,142,247,0.15); }
  .rank-card:hover::before { background: var(--accent-blue); }
  .rank-card.highlight { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.25); }
  .rank-number { font-family: 'Orbitron', monospace; font-weight: 700; font-size: 1rem; text-align: center; color: var(--text-muted); min-width: 30px; }
  .rank-number.top { color: var(--accent-cyan); }
  .seller-info { display: flex; flex-direction: column; gap: 2px; }
  .seller-main { display: flex; align-items: center; gap: 10px; }
  .avatar-mini { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; color: #fff; }
  .seller-name { font-weight: 600; font-size: 0.95rem; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px; }
  .seller-partner { font-size: 0.75rem; color: var(--text-muted); margin-left: 48px; }
  .seller-partner span { color: var(--accent-cyan); opacity: 0.8; }
  .points-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .points-value { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px; }
  .points-value.positive { color: var(--positive); background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.25); }
  .points-value.negative { color: var(--negative); background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.2); }
  .points-label { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
  .revenue-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 120px; }
  .revenue-value { font-weight: 700; font-size: 0.9rem; color: var(--text-primary); }
  .revenue-bar-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .revenue-bar { height: 100%; border-radius: 2px; transition: width 1s ease; }
  .av-0 { background: linear-gradient(135deg, #7c3aed, #4f8ef7); }
  .av-1 { background: linear-gradient(135deg, #ec4899, #8b5cf6); }
  .av-2 { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
  .av-3 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .av-4 { background: linear-gradient(135deg, #10b981, #059669); }
  .av-5 { background: linear-gradient(135deg, #f97316, #dc2626); }
  .av-6 { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .av-7 { background: linear-gradient(135deg, #14b8a6, #0ea5e9); }
  .av-8 { background: linear-gradient(135deg, #d946ef, #7c3aed); }
  .av-9 { background: linear-gradient(135deg, #84cc16, #22c55e); }
  .av-10 { background: linear-gradient(135deg, #fb923c, #f59e0b); }
  .av-11 { background: linear-gradient(135deg, #38bdf8, #818cf8); }
  .av-12 { background: linear-gradient(135deg, #a855f7, #ec4899); }
  .rank-card.last-place { background: rgba(255,23,68,0.05); border-color: rgba(255,23,68,0.15); }
  .rank-card.last-place::before { background: var(--negative); opacity: 0.5; }
  .footer { text-align: center; margin-top: 30px; font-size: 0.75rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; animation: fadeDown 0.6s ease 0.8s both; }
  .footer span { color: var(--accent-cyan); font-family: 'Orbitron', monospace; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--accent-purple); border-radius: 3px; }
  @media (max-width: 600px) {
    .revenue-col { display: none; }
    .rank-card { grid-template-columns: 32px 1fr auto; }
    .podium-block { width: 110px; }
    .header h1 { font-size: 1.3rem; }
  }

  /* Shimmer effect for top-3 highlight cards */
  .rank-card.highlight {
    background: rgba(255,215,0,0.06);
    border-color: rgba(255,215,0,0.25);
  }
  .rank-card.highlight::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; bottom: 0;
    width: 60%;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.12) 50%, transparent 100%);
    transform: skewX(-15deg);
    animation: shimmerSweep 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmerSweep {
    0%   { left: -100%; }
    60%  { left: 150%; }
    100% { left: 150%; }
  }

  /* Gold pulse glow on rank-1 podium avatar */
  @keyframes goldPulseGlow {
    0%, 100% {
      box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,165,0,0.3), 0 0 90px rgba(255,215,0,0.15), inset 0 0 20px rgba(255,215,0,0.1);
    }
    50% {
      box-shadow: 0 0 50px rgba(255,215,0,0.9), 0 0 90px rgba(255,165,0,0.6), 0 0 130px rgba(255,215,0,0.35), inset 0 0 30px rgba(255,215,0,0.2);
    }
  }
  #pod1 {
    animation: goldPulseGlow 2s ease-in-out infinite;
  }

  /* Reveal Overlay */
  #revealOverlay { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(ellipse at center, #1a0a40 0%, #0a0618 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; overflow: hidden; }
  #revealOverlay h2 { font-family: 'Orbitron', monospace; font-size: clamp(1.2rem, 3.5vw, 2rem); letter-spacing: 4px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }

  /* Number slam animation */
  @keyframes numSlam {
    0%   { transform: scale(2.5); opacity: 0; }
    55%  { transform: scale(0.88); opacity: 1; }
    75%  { transform: scale(1.08); }
    90%  { transform: scale(0.97); }
    100% { transform: scale(1); opacity: 1; }
  }
  .big-num {
    font-family: 'Orbitron', monospace;
    font-size: clamp(5rem, 18vw, 11rem);
    font-weight: 900;
    background: linear-gradient(135deg, #fff, var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    filter: drop-shadow(0 0 40px rgba(0,212,255,0.7));
    margin-bottom: 24px;
  }
  .big-num.slam {
    animation: numSlam 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* Reveal card — base state (exit = slide up & fade) */
  .reveal-card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 30px 40px;
    display: flex;
    align-items: center;
    gap: 28px;
    min-width: min(680px, 92vw);
    max-width: 780px;
    position: relative;
    overflow: hidden;
    transform: scale(0.7) translateY(40px);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
  }
  .reveal-card.show { transform: scale(1) translateY(0); opacity: 1; }
  .reveal-card.exit {
    transform: scale(0.9) translateY(-60px);
    opacity: 0;
    transition: transform 0.35s ease-in, opacity 0.3s ease-in;
  }

  .reveal-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .reveal-card.top1::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .reveal-card.top2::before { background: var(--silver); }
  .reveal-card.top3::before { background: var(--bronze); }
  .reveal-card.other::before { background: var(--accent-blue); }
  .reveal-rank-num { font-family: 'Orbitron', monospace; font-size: 3rem; font-weight: 900; min-width: 70px; text-align: center; }
  .reveal-card.top1 .reveal-rank-num { color: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }
  .reveal-card.top2 .reveal-rank-num { color: var(--silver); }
  .reveal-card.top3 .reveal-rank-num { color: var(--bronze); }
  .reveal-card.other .reveal-rank-num { color: var(--text-muted); }
  .reveal-avatar { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.8rem; color: #fff; flex-shrink: 0; }
  .reveal-card.top1 .reveal-avatar { border: 4px solid var(--gold); box-shadow: 0 0 24px rgba(255,215,0,0.6); }
  .reveal-card.top2 .reveal-avatar { border: 4px solid var(--silver); }
  .reveal-card.top3 .reveal-avatar { border: 4px solid var(--bronze); }
  .reveal-info { flex: 1; }
  .reveal-name { font-family: 'Orbitron', monospace; font-size: clamp(1.2rem, 3.5vw, 1.8rem); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-primary); margin-bottom: 8px; }
  .reveal-prize { font-size: 1rem; color: var(--accent-cyan); font-weight: 600; margin-bottom: 4px; }
  .reveal-revenue { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }
  .reveal-prize-badge { background: rgba(255,215,0,0.12); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 12px 20px; text-align: center; flex-shrink: 0; }
  .reveal-prize-badge .prize-val { font-family: 'Orbitron', monospace; font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 700; color: var(--gold); }
  .reveal-prize-badge .prize-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .reveal-pts-wrap { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
  .reveal-pts-label { font-size: 0.7rem; letter-spacing: 3px; color: var(--text-muted); font-family: 'Orbitron', monospace; }
  .reveal-pts-val { font-family: 'Orbitron', monospace; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 900; color: var(--accent-cyan); filter: drop-shadow(0 0 8px rgba(0,212,255,0.5)); letter-spacing: 1px; }
  .reveal-card.top1 .reveal-pts-val { color: var(--gold); filter: drop-shadow(0 0 10px rgba(255,215,0,0.7)); }
  .reveal-card.top2 .reveal-pts-val { color: var(--silver); }
  .reveal-card.top3 .reveal-pts-val { color: var(--bronze); }

  /* Screen flash overlay */
  #screenFlash {
    position: fixed;
    inset: 0;
    z-index: 1200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.08s ease-in;
  }

  #skipBtn { position: fixed; bottom: 24px; right: 24px; z-index: 1100; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--text-muted); font-family: 'Exo 2', sans-serif; font-size: 0.8rem; letter-spacing: 1px; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: all 0.2s ease; }
  #skipBtn:hover { background: rgba(255,255,255,0.15); color: var(--text-primary); }
  #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1050; display: none; }
  #fireworkCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1060; display: none; }
  .prize-tag { font-size: 0.7rem; font-weight: 700; color: var(--gold); background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.25); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .prize-tag.small { color: var(--accent-cyan); background: rgba(0,212,255,0.07); border-color: rgba(0,212,255,0.2); }
  @keyframes ringPulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.5); opacity: 0; } }
  .ring-fx { position: absolute; inset: 0; border-radius: 16px; border: 2px solid var(--gold); animation: ringPulse 0.8s ease-out forwards; pointer-events: none; }
</style>
</head>
<body>

<!-- Background floating stars canvas -->
<canvas id="bgCanvas"></canvas>

<div class="container">
  <div class="header">
    <div class="trophy-icon">🏆</div>
    <h1>Ranking de Vendas</h1>
    <div class="trophy-icon">🏆</div>
  </div>
  <div class="podium-section">
    <div class="podium-item rank-2">
      <div class="podium-avatar-wrap">
        <div class="rank-badge">🥈</div>
        <div class="podium-avatar" id="pod2" style="overflow:hidden;padding:0;border:3px solid var(--silver);box-shadow:0 0 20px rgba(192,192,192,0.5)"><img style="width:100%;height:100%;object-fit:cover;border-radius:50%" /></div>
      </div>
      <div class="podium-block rank-2">
        <div class="podium-name">Marcelo</div>
        <div class="podium-value">107.500 pts</div>
      </div>
    </div>
    <div class="podium-item rank-1">
      <div class="podium-avatar-wrap">
        <div class="rank-badge">👑</div>
        <div class="podium-avatar" id="pod1" style="overflow:hidden;padding:0;border:3px solid var(--gold);"><img style="width:100%;height:100%;object-fit:cover;border-radius:50%" /></div>
      </div>
      <div class="podium-block rank-1">
        <div class="podium-name">Wclayton</div>
        <div class="podium-value">128.000 pts</div>
      </div>
    </div>
    <div class="podium-item rank-3">
      <div class="podium-avatar-wrap">
        <div class="rank-badge">🥉</div>
        <div class="podium-avatar" id="pod3" style="overflow:hidden;padding:0;border:3px solid var(--bronze);box-shadow:0 0 20px rgba(205,127,50,0.5)"><img style="width:100%;height:100%;object-fit:cover;border-radius:50%" /></div>
      </div>
      <div class="podium-block rank-3">
        <div class="podium-name">Guilherme</div>
        <div class="podium-value">95.000 pts</div>
      </div>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-pill">👤 <span>14</span> Vendedores</div>
    <div class="stat-pill">🏆 Líder: <span>128.000 pts</span></div>
    <div class="stat-pill">📊 Total: <span>14</span> representantes</div>
  </div>
  <div class="ranking-list" id="rankingList"></div>
  <div class="footer">Atualizado em tempo real &nbsp;·&nbsp; <span>VENDAS 2025</span></div>
</div>

<!-- Screen flash element -->
<div id="screenFlash"></div>

<div id="revealOverlay">
  <h2>Revelando o ranking...</h2>
  <div class="big-num" id="bigNum">14°</div>
</div>

<canvas id="confettiCanvas"></canvas>
<canvas id="fireworkCanvas"></canvas>
<button id="skipBtn">Pular animação ⏭</button>

<script>
const photos = {
  /* PHOTOS_PLACEHOLDER - keep existing base64 photos here */
};

const rankingData = [
  { rank: 1,  name: "Wclayton",  partner: "Parceiro A", points: 128000, revenue: 450000, change: 12 },
  { rank: 2,  name: "Marcelo",   partner: "Parceiro B", points: 107500, revenue: 385000, change: 8 },
  { rank: 3,  name: "Guilherme", partner: "Parceiro C", points: 95000,  revenue: 340000, change: -2 },
  { rank: 4,  name: "Alisson",   partner: "Parceiro D", points: 87500,  revenue: 315000, change: 5 },
  { rank: 5,  name: "Paulo",     partner: "Parceiro E", points: 82000,  revenue: 295000, change: 3 },
  { rank: 6,  name: "Fernanda",  partner: "Parceiro F", points: 78500,  revenue: 280000, change: -1 },
  { rank: 7,  name: "Ricardo",   partner: "Parceiro G", points: 72000,  revenue: 260000, change: 2 },
  { rank: 8,  name: "Juliana",   partner: "Parceiro H", points: 68500,  revenue: 245000, change: 4 },
  { rank: 9,  name: "Carlos",    partner: "Parceiro I", points: 65000,  revenue: 235000, change: -3 },
  { rank: 10, name: "Marina",    partner: "Parceiro J", points: 61500,  revenue: 220000, change: 1 },
  { rank: 11, name: "Thiago",    partner: "Parceiro K", points: 58000,  revenue: 205000, change: 0 },
  { rank: 12, name: "Beatriz",   partner: "Parceiro L", points: 54500,  revenue: 195000, change: -5 }
];

/* ─────────────────────────────────────────────
   1. BACKGROUND FLOATING STARS
   ───────────────────────────────────────────── */
(function initBgStars() {
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');
  const COLORS = ['rgba(124,58,237,', 'rgba(79,142,247,', 'rgba(0,212,255,', 'rgba(255,255,255,'];

  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function spawnStars() {
    stars = Array.from({ length: 120 }, () => ({
      x:       Math.random() * canvas.width,
      y:       Math.random() * canvas.height,
      r:       0.5 + Math.random() * 1.8,
      speed:   0.15 + Math.random() * 0.4,
      drift:   (Math.random() - 0.5) * 0.3,
      alpha:   0.2 + Math.random() * 0.6,
      colorIdx: Math.floor(Math.random() * COLORS.length),
    }));
  }

  function animateBg() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.y  -= s.speed;
      s.x  += s.drift;
      if (s.y < -4) { s.y = canvas.height + 4; s.x = Math.random() * canvas.width; }
      if (s.x < -4) s.x = canvas.width + 4;
      if (s.x > canvas.width + 4) s.x = -4;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[s.colorIdx] + s.alpha + ')';
      ctx.fill();
    });
    requestAnimationFrame(animateBg);
  }

  resize();
  spawnStars();
  animateBg();
  window.addEventListener('resize', () => { resize(); spawnStars(); });
})();

/* ─────────────────────────────────────────────
   RANKING LIST
   ───────────────────────────────────────────── */
function initializeRanking() {
  const listContainer = document.getElementById('rankingList');
  listContainer.innerHTML = '';
  rankingData.forEach((seller, index) => {
    const card = document.createElement('div');
    card.className = 'rank-card';
    if (index === rankingData.length - 1) card.classList.add('last-place');
    if ([0, 1, 2].includes(index)) card.classList.add('highlight');

    const maxRevenue  = Math.max(...rankingData.map(s => s.revenue));
    const barWidth    = (seller.revenue / maxRevenue) * 100;
    const avatarClass = `av-${index % 13}`;
    const changeClass  = seller.change >= 0 ? 'positive' : 'negative';
    const changeSymbol = seller.change >= 0 ? '+' : '';

    card.innerHTML = `
      <div class="rank-number ${index < 3 ? 'top' : ''}">${seller.rank}</div>
      <div class="seller-info">
        <div class="seller-main">
          <div class="avatar-mini ${avatarClass}">${seller.name.charAt(0)}</div>
          <div class="seller-name">${seller.name}</div>
        </div>
        <div class="seller-partner">Parceria: <span>${seller.partner}</span></div>
      </div>
      <div class="points-col">
        <div class="points-value ${changeClass}">${changeSymbol}${seller.points.toLocaleString()}</div>
        <div class="points-label">PONTOS</div>
      </div>
      <div class="revenue-col">
        <div class="revenue-value">R$ ${(seller.revenue / 1000).toFixed(0)}k</div>
        <div class="revenue-bar-wrap">
          <div class="revenue-bar av-${index % 13}" style="width: ${barWidth}%"></div>
        </div>
      </div>
    `;
    listContainer.appendChild(card);
  });

  if (photos['Wclayton'])  { const el = document.getElementById('pod1'); if (el) el.querySelector('img').src = photos['Wclayton']; }
  if (photos['Marcelo'])   { const el = document.getElementById('pod2'); if (el) el.querySelector('img').src = photos['Marcelo']; }
  if (photos['Guilherme']) { const el = document.getElementById('pod3'); if (el) el.querySelector('img').src = photos['Guilherme']; }
}

/* ─────────────────────────────────────────────
   3. CONFETTI — physics-based
   ───────────────────────────────────────────── */
function triggerConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const PALETTE = ['#FFD700','#FFA500','#00d4ff','#ff4da6','#7c3aed','#4f8ef7','#00e676','#ffffff','#c0c0c0'];

  const particles = Array.from({ length: 160 }, () => {
    const isRect = Math.random() > 0.4;
    return {
      x:     Math.random() * canvas.width,
      y:     -20 - Math.random() * 300,
      vx:    (Math.random() - 0.5) * 5,
      vy:    1.5 + Math.random() * 3.5,
      gravity: 0.12 + Math.random() * 0.08,
      drag:   0.99,
      rot:   Math.random() * Math.PI * 2,
      rotV:  (Math.random() - 0.5) * 0.18,
      w:     isRect ? 6 + Math.random() * 8 : 4 + Math.random() * 4,
      h:     isRect ? 3 + Math.random() * 5 : 0,   // 0 = circle
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      alpha: 1,
      fadeStart: canvas.height * (0.55 + Math.random() * 0.25),
    };
  });

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.x  += p.vx;
      p.y  += p.vy;
      p.rot += p.rotV;

      // Fade as they approach bottom
      if (p.y > p.fadeStart) {
        p.alpha = Math.max(0, 1 - (p.y - p.fadeStart) / (canvas.height * 0.35));
      }

      if (p.y < canvas.height + 20 && p.alpha > 0.01) {
        alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle   = p.color;
        if (p.h === 0) {
          // Circle
          ctx.beginPath();
          ctx.arc(0, 0, p.w, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Rect
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }
    });
    if (alive) {
      requestAnimationFrame(animateConfetti);
    } else {
      canvas.style.display = 'none';
    }
  }
  animateConfetti();
}

/* ─────────────────────────────────────────────
   4. FIREWORKS (rank-1 only)
   ───────────────────────────────────────────── */
function triggerFireworks() {
  const canvas = document.getElementById('fireworkCanvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const PALETTE = ['#FFD700','#FFA500','#ffffff','#00d4ff','#ff4da6','#7c3aed','#00e676'];
  let particles = [];

  function burst(cx, cy) {
    const count = 22;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const speed = 3 + Math.random() * 5;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.09,
        drag: 0.97,
        color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        alpha: 1,
        r: 2 + Math.random() * 2,
        tail: [],
      });
    }
  }

  // 3 bursts staggered in time & position
  const positions = [
    { x: canvas.width * 0.25, y: canvas.height * 0.3 },
    { x: canvas.width * 0.5,  y: canvas.height * 0.2 },
    { x: canvas.width * 0.75, y: canvas.height * 0.32 },
  ];
  burst(positions[0].x, positions[0].y);
  setTimeout(() => burst(positions[1].x, positions[1].y), 300);
  setTimeout(() => burst(positions[2].x, positions[2].y), 600);

  function animateFireworks() {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.x  += p.vx;
      p.y  += p.vy;
      p.alpha -= 0.016;

      if (p.alpha > 0) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle   = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur  = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    });

    particles = particles.filter(p => p.alpha > 0);
    if (particles.length > 0) {
      requestAnimationFrame(animateFireworks);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = 'none';
    }
  }
  animateFireworks();
}

/* ─────────────────────────────────────────────
   5. SCREEN FLASH
   ───────────────────────────────────────────── */
function triggerScreenFlash(rank) {
  const flashColors = {
    1: 'rgba(255,215,0,0.22)',
    2: 'rgba(192,192,192,0.18)',
    3: 'rgba(205,127,50,0.2)',
  };
  const color = flashColors[rank];
  if (!color) return;

  const el = document.getElementById('screenFlash');
  el.style.background = color;
  el.style.opacity    = '1';
  setTimeout(() => {
    el.style.transition = 'opacity 0.55s ease-out';
    el.style.opacity    = '0';
    setTimeout(() => { el.style.transition = ''; }, 600);
  }, 120);
}

/* ─────────────────────────────────────────────
   REVEAL ANIMATION ORCHESTRATION
   ───────────────────────────────────────────── */
let currentRevealIndex = 0;

function startRevealAnimation() {
  document.getElementById('skipBtn').addEventListener('click', () => {
    document.getElementById('revealOverlay').style.display = 'none';
    document.getElementById('skipBtn').style.display      = 'none';
  });
  setTimeout(revealNextRank, 800);
}

function revealNextRank() {
  if (currentRevealIndex >= rankingData.length) {
    setTimeout(() => {
      document.getElementById('revealOverlay').style.display = 'none';
      document.getElementById('skipBtn').style.display      = 'none';
      triggerConfetti();
    }, 1000);
    return;
  }

  const seller = rankingData[rankingData.length - 1 - currentRevealIndex];
  const bigNum = document.getElementById('bigNum');

  // Number slam: remove class, force reflow, re-add
  bigNum.textContent = seller.rank + '°';
  bigNum.classList.remove('slam');
  void bigNum.offsetWidth; // reflow
  bigNum.classList.add('slam');

  setTimeout(() => {
    revealCard(seller);
    currentRevealIndex++;
    setTimeout(revealNextRank, 2400);
  }, 500);
}

function revealCard(seller) {
  const overlay = document.getElementById('revealOverlay');
  const old     = overlay.querySelector('.reveal-card');

  function doInsert() {
    const rankClass = seller.rank === 1 ? 'top1' : seller.rank === 2 ? 'top2' : seller.rank === 3 ? 'top3' : 'other';
    const idx       = rankingData.indexOf(seller);
    const avatarClass = `av-${idx % 13}`;
    const photo       = photos[seller.name];
    const avatarContent = photo
      ? `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />`
      : seller.name.charAt(0);

    const card = document.createElement('div');
    card.className = `reveal-card ${rankClass}`;
    card.innerHTML = `
      <div class="reveal-rank-num">${seller.rank}</div>
      <div class="reveal-avatar ${avatarClass}" style="${photo ? 'overflow:hidden;padding:0;' : ''}">${avatarContent}</div>
      <div class="reveal-info">
        <div class="reveal-name">${seller.name}</div>
        <div class="reveal-prize">${['🥇 1º Lugar','🥈 2º Lugar','🥉 3º Lugar'][seller.rank-1] || '🏅 ' + seller.rank + 'º Lugar'}</div>
        <div class="reveal-pts-wrap">
          <div class="reveal-pts-label">PONTOS</div>
          <div class="reveal-pts-val">${seller.points.toLocaleString()}</div>
        </div>
      </div>
      <div class="reveal-prize-badge">
        <div class="prize-val">R$ ${(seller.revenue/1000).toFixed(0)}k</div>
        <div class="prize-label">Receita</div>
      </div>
    `;

    const bigNum = overlay.querySelector('.big-num');
    overlay.insertBefore(card, bigNum ? bigNum.nextSibling : null);
    setTimeout(() => card.classList.add('show'), 50);

    // Screen flash for top 3
    if (seller.rank <= 3) triggerScreenFlash(seller.rank);

    // Fireworks for rank 1
    if (seller.rank === 1) setTimeout(triggerFireworks, 400);
  }

  if (old) {
    // 8. Smooth card exit: slide up + fade
    old.classList.remove('show');
    old.classList.add('exit');
    setTimeout(() => {
      old.remove();
      doInsert();
    }, 350);
  } else {
    doInsert();
  }
}

/* ─────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────── */
initializeRanking();
startRevealAnimation();
</script>
